{% load movix_tags %}{% with photo=person|profile_photo_url %}<span class="{{ avatar_class|default:'avatar' }}">{% if photo %}<img src="{{ photo }}" alt="Foto de {{ person.full_name }}" loading="lazy" referrerpolicy="no-referrer">{% elif person.has_profile_photo %}<img src="{% url 'panel:document_access' person.id 'profile' 'view' %}" alt="Foto de {{ person.full_name }}" loading="lazy">{% else %}{{ person.initials }}{% endif %}</span>{% endwith %}
